<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>
  
  <!-- Inner glowing ambient ring -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" opacity="0.15" filter="blur(20px)"/>
  
  <!-- Main Brand Icon: Modern Hexagonal Workflow Node -->
  <g filter="url(#dropShadow)">
    <path d="M 256 100 
             L 390 178 
             L 390 334 
             L 256 412 
             L 122 334 
             L 122 178 Z" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="28" 
          stroke-linejoin="round"
          stroke-linecap="round"/>
          
    <!-- Core Dynamics: Intersecting Data & Service Nodes -->
    <circle cx="256" cy="180" r="24" fill="#38bdf8"/>
    <circle cx="190" cy="295" r="24" fill="#60a5fa"/>
    <circle cx="322" cy="295" r="24" fill="#2563eb"/>
    
    <path d="M 256 180 L 190 295 M 256 180 L 322 295 M 190 295 L 322 295" 
          stroke="#94a3b8" 
          stroke-width="12" 
          stroke-dasharray="8 8"
          stroke-linecap="round"/>
          
    <!-- Center Pulse Core -->
    <circle cx="256" cy="260" r="16" fill="#f8fafc"/>
  </g>
</svg>
